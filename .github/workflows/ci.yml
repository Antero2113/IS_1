name: CI — Security checks

# Запускается автоматически при каждом push и создании pull request.
on:
  push:
  pull_request:

jobs:
  security:
    name: SAST + SCA + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      # =====================================================================
      # SAST — Static Application Security Testing
      # ---------------------------------------------------------------
      # Для JavaScript в задании лабораторной работы указано:
      #   «npm audit ИЛИ snyk test».
      # npm audit сверяет дерево зависимостей (включая транзитивные) с базой
      # известных уязвимостей npm. --audit-level=moderate останавливает сборку,
      # если найдены проблемы уровня moderate и выше.
      # =====================================================================
      - name: SAST — npm audit (known vulnerabilities in dependencies)
        run: npm audit --audit-level=moderate

      # Дополнительный SAST-слой: статический анализ ИСХОДНОГО КОДА
      # (ESLint + eslint-plugin-security). Ловит опасные паттерны в самом коде:
      # eval, небезопасные регулярные выражения, object injection и т.д.
      - name: SAST — ESLint static code analysis
        run: npx eslint .

      # =====================================================================
      # SCA — Software Composition Analysis
      # ---------------------------------------------------------------
      # В задании: «Используйте OWASP Dependency-Check ИЛИ Snyk».
      # Здесь используется OWASP Dependency-Check (не требует токенов).
      # Он анализирует зависимости (package-lock.json / node_modules), находит
      # CPE-идентификаторы и сопоставляет их с записями CVE, после чего
      # генерирует отчёт. Docker-образ action содержит свежую базу NVD,
      # поэтому пайплайн не тратит время на её обновление.
      # =====================================================================
      - name: SCA — OWASP Dependency-Check (dependency vulnerability scan)
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        with:
          project: 'IS_1'
          path: '.'
          format: 'HTML'
          out: 'reports'

      # «Выдача отчёта» сканера: публикуем сгенерированный HTML-отчёт как
      # артефакт сборки (Actions -> Artifacts -> dependency-check-report).
      - name: Upload Dependency-Check report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ${{ github.workspace }}/reports
          if-no-files-found: error

      # Динамические security-тесты API (JWT-поток, SQLi, XSS, rate-limit).
      - name: Run API security tests
        run: npm test