name: CI — Security checks

on:
  push:
  pull_request:

jobs:
  security:
    name: SAST + SCA + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      - name: SAST — npm audit (known vulnerabilities in dependencies)
        run: npm audit --audit-level=moderate

      - name: SAST — ESLint static code analysis
        run: npx eslint .

      - name: SCA — OWASP Dependency-Check (dependency vulnerability scan)
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        with:
          project: 'IS_1'
          path: '.'
          format: 'HTML'
          out: 'reports'

      - name: Upload Dependency-Check report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ${{ github.workspace }}/reports
          if-no-files-found: error

      # Динамические security-тесты API (JWT-поток, SQLi, XSS, rate-limit).
      - name: Run API security tests
        run: npm test
